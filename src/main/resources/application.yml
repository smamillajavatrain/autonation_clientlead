server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/autonation_crm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
